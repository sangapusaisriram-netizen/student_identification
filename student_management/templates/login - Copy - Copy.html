{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card">
<h1>Sign in</h1><p class="sub">Use your college email and password.</p>
<form method="post">
<p><label for="email">Email</label><input id="email" name="email" type="email" required autofocus></p>
<p><label for="password">Password</label><input id="password" name="password" type="password" required></p>
<button type="submit">Sign in</button>
</form></div>
{% endblock %}
