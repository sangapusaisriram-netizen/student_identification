{% extends "base.html" %}{% block title %}Password recovery{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Reset your password</h1>
  <p class="sub">Enter your account email. If it matches an account, we’ll send a one-time reset link.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></p>
    <button type="submit">Send reset link</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div>
{% endblock %}
